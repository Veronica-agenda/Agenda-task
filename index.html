<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda Task</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Task">
<meta name="theme-color" content="#f6dfe0">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f7; --card:#fff; --ink:#1d2433; --muted:#667085; --line:#e3e6ec; --navy:#22324a; --accent:#2f6fde;
  --ok:#1f9d55; --ok-bg:#e8f6ee; --warn:#c77700; --warn-bg:#fff4e0; --bad:#c9372c; --bad-bg:#fdecea; --info-bg:#eaf1fd;
  --r:14px; --sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
header.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
header.top h1{white-space:nowrap;font-size:18px;margin:0;font-weight:700;letter-spacing:.2px}
header.top .sync{font-size:12px;opacity:.8;display:flex;align-items:center;gap:5px}
header.top .sync i{width:8px;height:8px;border-radius:50%;background:#5ad18a;display:inline-block}
header.top .sync.off i{background:#f0b44c}
header.top .sync.loc i{background:#9aa4b2}
header.top .sp{flex:1}
.hbtn{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:10px;padding:7px 10px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px;text-decoration:none}
.hbtn svg{width:18px;height:18px}
nav.tabs{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--line);padding:6px 10px;position:sticky;top:52px;z-index:15}
nav.tabs button{flex:1;border:0;background:none;padding:8px 6px;border-radius:10px;color:var(--muted);font-weight:600;font-size:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--navy);background:#eef1f6}
nav.tabs .badge{background:var(--bad);color:#fff;border-radius:9px;font-size:11px;padding:0 6px;margin-left:4px}
main{max-width:1180px;margin:0 auto;padding:14px 14px 120px}
@media (max-width:899px){
  nav.tabs{position:fixed;top:auto;bottom:0;left:0;right:0;border-top:1px solid var(--line);border-bottom:0;padding:6px 8px calc(env(safe-area-inset-bottom) + 6px)}
  nav.tabs button{font-size:11px}
}
@media (min-width:900px){ nav.tabs button{flex-direction:row;justify-content:center;flex:0 0 auto;padding:8px 16px} nav.tabs{justify-content:center} }
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px}
.section{margin-bottom:16px}
h2{font-size:20px;margin:0}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:18px 2px 8px;display:flex;align-items:center;gap:8px}
h3 .cnt{background:#e7eaf0;color:var(--muted);border-radius:9px;padding:0 7px;font-size:12px;letter-spacing:0}
h3 .act{margin-left:auto;text-transform:none;letter-spacing:0}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:10px;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px}
/* barra inserimento rapido */
.quick{display:flex;gap:8px;align-items:center;background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:6px 6px 6px 14px;margin-bottom:6px}
.quick input{flex:1;border:0;outline:0;font-size:16px;padding:8px 0;min-width:0;background:transparent}
.quick .go{width:40px;height:40px;border-radius:10px;border:0;background:var(--navy);color:#fff;font-size:24px;line-height:1;cursor:pointer;flex:none}
.qprev{display:flex;flex-wrap:wrap;gap:6px;min-height:22px;margin:0 4px 10px;font-size:13px}
.qprev .pill{background:#e9edf4;color:var(--navy)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;background:#eef0f4;color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
/* intestazione giorno */
.dayhead{display:flex;align-items:flex-end;gap:12px;margin:4px 2px 12px}
.dayhead .big{font-size:26px;font-weight:800;line-height:1.1}
.dayhead .sub{color:var(--muted);font-size:14px}
.prog{height:8px;border-radius:6px;background:#e3e6ec;overflow:hidden;margin:4px 2px 2px}
.prog b{display:block;height:100%;background:var(--ok);border-radius:6px;transition:width .3s}
/* righe task */
.list{background:#fff;border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.trow{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);background:#fff}
.trow:last-child{border-bottom:0}
.chk{flex:none;width:26px;height:26px;border-radius:50%;border:2.5px solid var(--c,#9aa4b2);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:-1px;padding:0}
.chk svg{width:15px;height:15px;opacity:0;color:#fff;position:relative;z-index:1}
.trow.done .chk{background:var(--c,#9aa4b2)} .trow.done .chk svg{opacity:1}
.trow.done .tt{text-decoration:line-through;color:var(--muted)}
.tb{flex:1;min-width:0;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.tt{font-weight:600;word-wrap:break-word}
.tm{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px;color:var(--muted);margin-top:2px;align-items:center}
.tm .a{display:inline-flex;align-items:center;gap:5px}
.tm .late{color:var(--bad);font-weight:600}
.star{color:#e0a100;font-size:15px;line-height:1}
.time{font-weight:700;color:var(--navy);font-size:14px;min-width:44px;padding-top:2px}
.tr-act{display:flex;gap:4px;flex:none}
/* docenze dall'agenda */
.drow{display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 10%,#fff),#fff 60%)}
.drow:last-child{border-bottom:0}
.drow .bar{width:4px;align-self:stretch;border-radius:3px;background:var(--c)}
.drow .w{font-weight:600}
.drow.opz{opacity:.75}
.empty{padding:16px;color:var(--muted);text-align:center;font-size:14px}
.banner{border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.bad{background:var(--bad-bg)} .banner.warn{background:var(--warn-bg)} .banner.info{background:var(--info-bg)}
.banner .sp{flex:1}
.split{display:grid;gap:16px}
@media (min-width:900px){ .split{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)} }
/* settimana */
.wkbar,.calbar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.wkbar h2,.calbar h2{flex:1;font-size:19px;min-width:0}
@media (max-width:599px){ .wkbar h2{font-size:17px} .wkbar h2 .small{display:block} header.top .sync span{display:none} }
.week .wd.past .wadd{display:none}
.week{display:grid;gap:10px}
@media (min-width:900px){ .week .wd .tt{font-size:14px} .week{grid-template-columns:repeat(7,minmax(0,1fr));gap:8px} .week .wd .trow{padding:8px} .week .wd .tm{font-size:12px} .week .wd .chk{width:22px;height:22px} }
.wd{background:#fff;border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column}
.wd.today{outline:2px solid var(--accent)}
.wd.past{opacity:.8}
.wdh{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);background:#fafbfc}
.wdh b{font-size:15px;text-transform:capitalize}
.wdh .n{margin-left:auto}
.wd.today .wdh{background:var(--info-bg)}
.wadd{border:0;background:none;color:var(--muted);text-align:left;padding:9px 12px;cursor:pointer;font-size:14px}
.wadd:hover{color:var(--navy)}
.dchip{display:flex;gap:6px;align-items:center;font-size:13px;padding:6px 12px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--c) 9%,#fff)}
.dchip .dot{background:var(--c)}
/* mese */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wh{font-size:12px;color:var(--muted);text-align:center;padding:2px;text-transform:uppercase}
.cday{background:#fff;border-radius:10px;min-height:64px;padding:5px;border:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;box-shadow:var(--sh);overflow:hidden}
.cday .n{font-size:13px;font-weight:700}
.cday.out{opacity:.45}
.cday.today .n{background:var(--accent);color:#fff;border-radius:6px;padding:0 5px;align-self:flex-start}
.cday.sel{outline:2px solid var(--navy)}
.cday .dots{display:flex;flex-wrap:wrap;gap:3px}
.cday .dots .dot{width:7px;height:7px}
.cday .ev{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--c);padding-left:3px;color:var(--ink)}
.cday .more{font-size:11px;color:var(--muted)}
@media (max-width:599px){ .cday .ev{display:none} .cday{min-height:52px} }
@media (min-width:600px){ .cday .dots{display:none} .cday{min-height:92px} }
/* filtri aree */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chipf{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-weight:600}
.chipf[aria-pressed="false"]{opacity:.45}
.chipf .h{color:var(--muted);font-weight:500}
.search{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;margin-bottom:6px}
/* FAB */
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 84px);width:58px;height:58px;border-radius:18px;background:var(--navy);color:#fff;border:0;font-size:32px;box-shadow:0 6px 18px rgba(34,50,74,.35);cursor:pointer;z-index:30}
@media (min-width:900px){ .fab{bottom:28px;right:28px} }
/* modale */
.mback{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){ .mback{align-items:center} }
.modal{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px)}
@media (min-width:700px){ .modal{border-radius:18px} }
.modal h2{margin-bottom:12px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;flex:1;min-width:0}
.fld label,.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;width:100%;min-width:0}
.fld textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .fld{min-width:130px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:6px;font-weight:600}
.seg input:checked+label{border-color:var(--c,var(--navy));background:color-mix(in srgb,var(--c,var(--navy)) 13%,#fff);color:var(--ink)}
.seg input:focus-visible+label{outline:2px solid var(--accent)}
.quickd{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 12px}
.mfoot{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.mfoot .spacer{flex:1}
.hint{font-size:13px;color:var(--muted);margin:-6px 0 12px}
.subl{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.subi{display:flex;gap:8px;align-items:center}
.subi input[type=text]{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.subi input[type=checkbox]{width:20px;height:20px}
.toggle{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-weight:600;cursor:pointer}
.toggle input{width:20px;height:20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 90px);background:#1d2433;color:#fff;padding:10px 14px;border-radius:12px;z-index:80;display:flex;gap:14px;align-items:center;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:92vw}
.toast button{background:none;border:0;color:#8fb6ff;font-weight:700;cursor:pointer}
@media (min-width:900px){ .toast{bottom:30px} }
.login{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.login .card{width:100%;max-width:380px;padding:22px}
.login h2{font-size:24px;margin-bottom:4px}
.login .err{color:var(--bad);font-size:14px;min-height:20px;margin-bottom:6px}
.arearow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.arearow input[type=text]{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
.arearow input[type=color]{width:38px;height:34px;border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff}
.sugg{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.sugg:last-child{border-bottom:0}
.sugg .b{flex:1}
.trow.priv{background:color-mix(in srgb,var(--c) 7%,#fff)}
.glbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:2px 0 6px}
.scope{display:flex;gap:4px;background:#fff;border-radius:12px;box-shadow:var(--sh);padding:4px;margin:0 0 12px;max-width:420px}
.scope button{flex:1;border:0;background:none;border-radius:9px;padding:7px 8px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.scope button[aria-pressed="true"]{background:var(--navy);color:#fff}
.qline{display:block;width:100%;text-align:left;border:0;background:none;cursor:pointer;font-style:italic;color:var(--navy);font-size:15px;margin:8px 2px 4px;padding:0;font-family:Georgia,"Times New Roman",serif}
.qline span{font-style:normal;color:var(--muted);font-size:13px;font-family:system-ui,sans-serif}
.themes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.thm{border:1px solid var(--line);background:var(--tb);border-radius:12px;padding:6px 10px 6px 6px;display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;font-size:14px}
.thm .sw{width:26px;height:26px;border-radius:8px;background:var(--tc)}
.thm[aria-pressed="true"]{outline:2px solid var(--tc);outline-offset:1px}
.arearow select{border:1px solid var(--line);border-radius:8px;padding:6px;background:#fff;font-size:13px}
.splash{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:28px;opacity:0;transition:opacity .35s;
  background:radial-gradient(120% 90% at 20% 10%,color-mix(in srgb,var(--navy) 55%,#fff) 0%,var(--navy) 55%,color-mix(in srgb,var(--navy) 70%,#000) 100%);color:#fff}
.splash.on{opacity:1}
.sp-in{max-width:520px;width:100%;transform:translateY(12px);transition:transform .5s}
.splash.on .sp-in{transform:none}
.sp-date{text-transform:uppercase;letter-spacing:2px;font-size:13px;opacity:.75}
.sp-hi{font-size:34px;font-weight:800;margin:6px 0 26px;line-height:1.1}
.splash blockquote{margin:0 0 26px;font-family:Georgia,"Times New Roman",serif;font-size:25px;line-height:1.35;font-style:italic;border-left:3px solid rgba(255,255,255,.5);padding-left:18px}
.splash cite{display:block;font-style:normal;font-family:system-ui,sans-serif;font-size:14px;opacity:.75;margin-top:12px}
.sp-sum{font-size:16px;opacity:.9;margin-bottom:28px}
.sp-go{background:#fff;color:var(--navy);border:0;border-radius:14px;padding:13px 22px;font-weight:700;font-size:16px;cursor:pointer}
details.done-box summary{cursor:pointer;color:var(--muted);font-size:14px;margin:14px 2px 8px;font-weight:600}

/* ===== Stile «cipria» ===== */
:root{--acc:#b76e79;--navy:#7a3e4b;--bg:#fbf4f3;--soft:#f6dfe0;--ink:#3b2a2f;--muted:#8a7479;--line:#f0e2e3;--r:18px;
  --sh:0 1px 2px rgba(122,62,75,.05),0 6px 18px rgba(122,62,75,.07);--serif:"Playfair Display",Georgia,"Times New Roman",serif}
html,body{font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg)}
body{background:radial-gradient(900px 500px at 100% -10%,color-mix(in srgb,var(--soft) 80%,transparent),transparent 70%),radial-gradient(700px 500px at -10% 30%,color-mix(in srgb,var(--soft) 45%,transparent),transparent 70%),var(--bg);background-attachment:fixed;min-height:100vh}
header.top{background:linear-gradient(120deg,var(--soft),color-mix(in srgb,var(--soft) 40%,var(--bg)));color:var(--navy);box-shadow:0 1px 0 var(--line)}
header.top h1{font-family:var(--serif);font-style:italic;font-weight:600;font-size:22px;letter-spacing:0}
header.top h1::before{content:"✿ ";font-style:normal;color:var(--acc);font-size:18px}
.hbtn{background:rgba(255,255,255,.65);color:var(--navy)}
header.top .sync{color:var(--muted);opacity:1}
nav.tabs{background:rgba(255,255,255,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-color:var(--line)}
@media (min-width:900px){ nav.tabs{top:58px} }
h3 .btn,h3 .act{font-family:"Nunito",sans-serif;font-style:normal}
nav.tabs button{color:var(--muted);border-radius:14px}
nav.tabs button[aria-current="page"]{color:var(--navy);background:var(--soft)}
nav.tabs .badge{background:var(--acc)}
@media (max-width:899px){ nav.tabs{border-radius:22px 22px 0 0;box-shadow:0 -6px 20px rgba(122,62,75,.08)} }
h2,.dayhead .big,.wkbar h2,.calbar h2,.modal h2,.login h2{font-family:var(--serif);font-weight:700;color:var(--navy)}
.dayhead .big{font-size:30px}
h3{font-family:var(--serif);font-style:italic;text-transform:none;letter-spacing:0;font-size:18px;font-weight:600;color:var(--navy);margin:22px 4px 10px}
h3::before{content:"✦";font-style:normal;font-size:11px;color:var(--acc)}
h3 .cnt{background:var(--soft);color:var(--navy);font-family:"Nunito",sans-serif;font-style:normal;font-weight:700}
.btn{border-color:var(--line);border-radius:999px;color:var(--navy)}
.btn.sm{border-radius:999px;padding:5px 12px}
.btn.primary,.quick .go,.sp-go,.fab{background:linear-gradient(135deg,var(--acc),var(--navy));border:0;color:#fff}
.iconbtn{border-radius:999px;border-color:var(--line);color:var(--navy)}
.quick{border-radius:999px;padding:6px 6px 6px 20px;box-shadow:var(--sh)}
.quick .go{border-radius:50%}
.qprev .pill{background:#fff;color:var(--navy);box-shadow:0 0 0 1px var(--line) inset}
.scope{border-radius:999px;box-shadow:var(--sh)}
.scope button{border-radius:999px;color:var(--muted)}
.scope button[aria-pressed="true"]{background:var(--soft);color:var(--navy)}
.prog{height:10px;background:#fff;box-shadow:0 0 0 1px var(--line) inset}
.prog b{background:linear-gradient(90deg,var(--soft),var(--acc))}
.qline{color:var(--navy);font-family:var(--serif);font-size:16px}
/* task come piccole schede */
.list{background:transparent;box-shadow:none;overflow:visible;display:flex;flex-direction:column;gap:8px}
.trow{border:0;border-radius:16px;box-shadow:var(--sh);padding:12px 14px;position:relative;transition:transform .15s}
.trow:last-child{border-bottom:0}
.trow::after{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--c);opacity:.55}
.trow.priv{background:linear-gradient(100deg,color-mix(in srgb,var(--c) 11%,#fff),#fff 70%)}
.chk{border-width:2px;background:color-mix(in srgb,var(--c) 12%,#fff);width:26px;height:26px}
.chk::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);opacity:.5;position:absolute}
.chk{position:relative}
.trow.done .chk::before{display:none}
.trow.done{background:color-mix(in srgb,#fff 70%,var(--bg));box-shadow:none}
.trow.done .tt{color:#b9a8ac}
.trow.pop .chk{animation:pop .5s ease}
.trow.pop::before{content:"✦  ✧  ✦";position:absolute;left:4px;top:-6px;color:var(--acc);font-size:12px;letter-spacing:2px;animation:spark .8s ease forwards;pointer-events:none}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes spark{0%{opacity:0;transform:translateY(6px)}40%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.tt{font-weight:700}
.time{font-family:var(--serif);font-style:italic;color:var(--acc);font-size:15px}
.star{color:var(--acc)}
.star::before{content:""}
.drow{border:0;border-radius:16px;box-shadow:var(--sh);background:linear-gradient(100deg,color-mix(in srgb,var(--c) 12%,#fff),#fff 70%)}
.empty{background:#fff;border-radius:16px;box-shadow:var(--sh);font-style:italic}
.wd{border-radius:20px}
.wd .list,.wd{gap:0}
.wd .trow{box-shadow:none;border-radius:0;border-bottom:1px solid var(--line)}
.wd .trow::after{display:none}
.wdh{background:color-mix(in srgb,var(--soft) 35%,#fff);border-color:var(--line)}
.wdh b{font-family:var(--serif);font-size:16px;color:var(--navy)}
.wd.today{outline:2px solid var(--acc)}
.wd.today .wdh{background:var(--soft)}
.cday{border-radius:14px}
.cday.today .n{background:var(--acc)}
.cday.sel{outline:2px solid var(--acc)}
.chipf{border-radius:999px;border-color:var(--line)}
.search{border-radius:999px;border-color:var(--line);padding:11px 18px}
.modal{border-radius:26px 26px 0 0;background:linear-gradient(180deg,color-mix(in srgb,var(--soft) 35%,#fff),#fff 140px)}
@media (min-width:700px){ .modal{border-radius:26px} }
.fld input,.fld select,.fld textarea{border-radius:14px;border-color:var(--line)}
.seg label{border-color:var(--line);background:#fff}
.seg input:checked+label{border-color:var(--c,var(--acc));background:color-mix(in srgb,var(--c,var(--acc)) 15%,#fff)}
.toggle input,.subi input[type=checkbox]{accent-color:var(--acc)}
.toast{background:var(--navy);border-radius:999px;padding:10px 18px}
.toast button{color:var(--soft)}
.fab{border-radius:50%;box-shadow:0 8px 22px color-mix(in srgb,var(--acc) 45%,transparent)}
.pill.ok{background:var(--soft);color:var(--navy)}
.banner.info{background:var(--soft)}
.sugg{background:#fff;border-radius:16px;box-shadow:var(--sh);border:0}
.thm{border-radius:999px;padding:5px 12px 5px 5px}
.thm .sw{border-radius:50%;background:linear-gradient(135deg,var(--tc),var(--td))}
.login{background:radial-gradient(600px 400px at 80% 0%,var(--soft),transparent),var(--bg)}
.login .card{border-radius:26px}
/* benvenuto */
.splash{color:var(--navy);background:
  radial-gradient(420px 420px at 85% 12%,color-mix(in srgb,var(--acc) 35%,transparent),transparent 70%),
  radial-gradient(380px 380px at 8% 88%,color-mix(in srgb,var(--soft) 95%,transparent),transparent 70%),
  radial-gradient(300px 300px at 15% 20%,rgba(255,226,206,.7),transparent 70%),var(--bg)}
.sp-date{color:var(--acc);font-weight:700}
.sp-hi{font-family:var(--serif);font-style:italic;font-weight:600;font-size:38px;margin-bottom:22px}
.sp-orn{color:var(--acc);font-size:13px;letter-spacing:3px;text-transform:uppercase;margin:-8px 0 14px}
.splash blockquote{font-family:var(--serif);font-size:27px;border-left:0;padding:0;color:var(--ink)}
.splash cite{color:var(--acc);opacity:1;font-weight:700;letter-spacing:.5px}
.sp-sum{color:var(--muted);opacity:1}
.sp-go{border-radius:999px;padding:14px 28px;box-shadow:0 8px 22px color-mix(in srgb,var(--acc) 40%,transparent)}
</style>
</head>

<script type="module">
"use strict";
/* ---------- utilità ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d||1); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const today = () => iso(new Date());
const ym = s => s.slice(0,7);
const addMonths = (m,n) => { const d = parse(m+"-01"); d.setMonth(d.getMonth()+n); return iso(d).slice(0,7); };
const lastDay = m => { const d = parse(m+"-01"); d.setMonth(d.getMonth()+1); d.setDate(0); return iso(d); };
const daysBetween = (a,b) => Math.round((parse(b)-parse(a))/86400000);
const wdi = s => (parse(s).getDay()+6)%7;            // 0 = lunedì
const monday = s => addDays(s, -wdi(s));
const MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const GGS = ["lun","mar","mer","gio","ven","sab","dom"];
const GGL = ["lunedì","martedì","mercoledì","giovedì","venerdì","sabato","domenica"];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fmtDay = s => { const d = parse(s); return `${GGL[wdi(s)]} ${d.getDate()} ${MESI[d.getMonth()]}`; };
const fmtDshort = s => { const d = parse(s); return `${GGS[wdi(s)]} ${d.getDate()}/${pad(d.getMonth()+1)}`; };
const relDay = s => { const n = daysBetween(today(), s); return n===0?"oggi":n===1?"domani":n===-1?"ieri":n===2?"dopodomani":(n>2&&n<7)?GGL[wdi(s)]:fmtDshort(s); };
const plural = (n, s, p) => `${n} ${n===1?s:p}`;
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"");
const CHECK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;

/* ---------- aree ---------- */
const AREE_BASE = [
  {key:"scilla", nome:"Scilla", c:"#2e9e5b", g:"lavoro"},
  {key:"bioinvent", nome:"BioInvent", c:"#2f6fde", g:"lavoro"},
  {key:"cmb", nome:"CMB", c:"#e07a1f", g:"lavoro"},
  {key:"studioeffe", nome:"Studioeffe", c:"#d6478f", g:"lavoro"},
  {key:"papa", nome:"Papà", c:"#7b4fd1", g:"lavoro"},
  {key:"admin", nome:"Fatture e admin", c:"#5b6b84", g:"lavoro"},
  {key:"privato", nome:"Personale", c:"#d4a106", g:"privato"},
  {key:"casa", nome:"Casa", c:"#b5523b", g:"privato"},
  {key:"famiglia", nome:"Famiglia", c:"#e8836b", g:"privato"}
];
const grp = k => (area(k).g === "privato" ? "privato" : "lavoro");
// nomi e colori delle realtà come nell'Agenda Docenze (le tue modifiche lì hanno la precedenza)
const DOC_BASE = {scilla:{nome:"Scilla",c:"#2e9e5b"}, bioinvent:{nome:"BioInvent",c:"#2f6fde"}, bio:{nome:"BioInvent",c:"#2f6fde"}, cmb:{nome:"CMB",c:"#e07a1f"}, papa:{nome:"Papà",c:"#7b4fd1"}, studioeffe:{nome:"Studioeffe",c:"#d6478f"}, sf:{nome:"Studioeffe",c:"#d6478f"}};

/* ---------- stato ---------- */
let tasks = new Map();      // le tue task
let ext = new Map();        // dati dell'Agenda Docenze (solo lettura)
let mode = "loading";       // loading | cloud | local
let pendingWrites = false;
let store = null;           // {save, patch, del}
let scope0 = "tutto"; try { scope0 = localStorage.getItem("task-scope") || "tutto"; } catch(e){}
const ui = { scope: scope0, tab: (location.hash.slice(1) || "oggi"), wk: monday(today()), calMonth: today().slice(0,7), selDay: today(), q: "", filt: null, showDone: false };
if (!["oggi","settimana","mese","elenco"].includes(ui.tab)) ui.tab = "oggi";

function settings(){ return tasks.get("settings") || {}; }
function aree(){
  const s = settings();
  const list = (s.aree && s.aree.length) ? s.aree : AREE_BASE;
  return list.filter(a => !a.hidden);
}
function allAree(){ const s = settings(); return (s.aree && s.aree.length) ? s.aree : AREE_BASE; }
function area(k){ return allAree().find(a => a.key === k) || {key:k||"privato", nome:k ? cap(k) : "Senza area", c:"#9aa4b2", g:"privato"}; }
const inScope = t => !ui.scope || ui.scope === "tutto" || grp(t.area) === ui.scope;
const showPay = () => settings().showPay !== false;
const T = () => [...tasks.values()].filter(t => t.k === "task" && inScope(t));

/* ---------- ricorrenze ---------- */
const REP_LABEL = r => {
  if (!r) return "";
  const n = r.n || 1;
  switch (r.f){
    case "d": return n===1 ? "ogni giorno" : `ogni ${n} giorni`;
    case "wd": return "lun–ven";
    case "w": { const ds = (r.days||[]).map(i => GGS[i]).join(", "); return (n===1?"ogni settimana":`ogni ${n} settimane`) + (ds?` (${ds})`:""); }
    case "m": return n===1 ? "ogni mese" : `ogni ${n} mesi`;
    case "ml": return "ultimo giorno del mese";
    case "y": return "ogni anno";
  }
  return "";
};
function occurs(t, D){
  if (!t.rep) return t.d === D;
  if (!t.d || D < t.d) return false;
  if (t.rep.until && D > t.rep.until) return false;
  if ((t.skip||[]).includes(D)) return false;
  const r = t.rep, n = Math.max(1, r.n||1);
  switch (r.f){
    case "d": return daysBetween(t.d, D) % n === 0;
    case "wd": return wdi(D) < 5;
    case "w": { const days = (r.days && r.days.length) ? r.days : [wdi(t.d)]; if (!days.includes(wdi(D))) return false; return (daysBetween(monday(t.d), monday(D))/7) % n === 0; }
    case "m": { const s = parse(t.d), d = parse(D); const md = (d.getFullYear()-s.getFullYear())*12 + d.getMonth()-s.getMonth(); if (md % n) return false; const want = Math.min(s.getDate(), parse(lastDay(ym(D))).getDate()); return d.getDate() === want; }
    case "ml": return D === lastDay(ym(D));
    case "y": return D.slice(5) === t.d.slice(5);
  }
  return false;
}
const isDone = (t, D) => t.rep ? (t.doneDates||[]).includes(D) : !!t.done;
function inst(t, D){ return {t, D, done: isDone(t, D)}; }
const sortInst = (a,b) => (a.done-b.done) || ((a.t.h?0:1)-(b.t.h?0:1)) || String(a.t.h||"").localeCompare(String(b.t.h||"")) || ((b.t.pr?1:0)-(a.t.pr?1:0)) || String(a.t.cr||"").localeCompare(String(b.t.cr||""));
function dayList(D){ return T().filter(t => occurs(t, D)).map(t => inst(t, D)).sort(sortInst); }
function lateList(){
  const t0 = today(), out = [];
  T().forEach(t => {
    if (!t.rep){ if (!t.done && t.d && t.d < t0) out.push(inst(t, t.d)); return; }
    if (t.rep.f === "d" || t.rep.f === "wd") return;            // le abitudini quotidiane non si accumulano
    for (let i=1; i<=14; i++){ const D = addDays(t0, -i); if (occurs(t, D)){ if (!isDone(t, D)) out.push(inst(t, D)); break; } }
  });
  return out.sort((a,b) => a.D.localeCompare(b.D) || sortInst(a,b));
}
const unplanned = () => T().filter(t => !t.rep && !t.d && !t.done);

/* ---------- pagamenti attesi (dalle fatture dell'Agenda Docenze, sola lettura) ---------- */
function docArea(k){
  const st = ext.get("settings"), o = (st && st.az && st.az[k]) || {};
  const b = DOC_BASE[k] || {nome: k ? cap(k) : "Cliente", c:"#9aa4b2"};
  return {nome: o.nome || b.nome, c: o.c || b.c};
}
const unpaid = () => (showPay() && ui.scope !== "privato") ? [...ext.values()].filter(x => x.k === "fat" && !x.pagata && x.scad) : [];
function docFor(D){ return unpaid().filter(x => x.scad === D).map(x => ({kind:"pag", x, a:docArea(x.az)})); }
const latePayments = () => unpaid().filter(x => x.scad < today()).sort((a,b) => a.scad.localeCompare(b.scad));
const eurF = n => Number(n||0).toLocaleString("it-IT",{style:"currency",currency:"EUR"});
const fatLabel = x => `fattura${x.numero?" n. "+x.numero:""} ${docArea(x.az).nome}${x.importo?" ("+eurF(x.importo)+")":""}`;
const hasSollecito = x => [...tasks.values()].some(t => t.k === "task" && t.fat === x.id && !t.done);

/* ---------- inserimento veloce in linguaggio naturale ---------- */
const WD_RE = "(lunedi|lunedì|lun|martedi|martedì|mar|mercoledi|mercoledì|mer|giovedi|giovedì|gio|venerdi|venerdì|ven|sabato|sab|domenica|dom)";
const wdFrom = w => ({lun:0,mar:1,mer:2,gio:3,ven:4,sab:5,dom:6})[norm(w).slice(0,3)];
const MESI_RE = "(gennaio|febbraio|marzo|aprile|maggio|giugno|luglio|agosto|settembre|ottobre|novembre|dicembre|gen|feb|mar|apr|mag|giu|lug|ago|set|ott|nov|dic)";
const meseFrom = w => ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"].indexOf(norm(w).slice(0,3));
function nextWd(i, fromD){ const d0 = fromD || today(); const diff = (i - wdi(d0) + 7) % 7; return addDays(d0, diff); }
function parseQuick(str, defDate){
  let s = " " + str + " ";
  const r = {d: defDate ?? null, h:null, area:null, pr:false, rep:null};
  const take = (re, fn) => { const m = s.match(re); if (m){ s = s.replace(m[0], " "); fn(m); return true; } return false; };
  take(/\s!{1,3}(?=\s)/, () => r.pr = true) || take(/\s(urgente|importante)(?=\s)/i, () => r.pr = true);
  take(/\s#(\S+)/, m => { const q = norm(m[1]); const a = allAree().find(a => norm(a.key).startsWith(q) || norm(a.nome).startsWith(q)); if (a) r.area = a.key; });
  // ricorrenze
  take(/\sogni\s+(\d+)\s+giorni(?=\s)/i, m => r.rep = {f:"d", n:+m[1]}) ||
  take(/\s(ogni\s+giorno|tutti\s+i\s+giorni)(?=\s)/i, () => r.rep = {f:"d", n:1}) ||
  take(/\s(dal\s+lunedi\s+al\s+venerdi|dal\s+lunedì\s+al\s+venerdì|(?:nei\s+)?(?:giorni\s+)?feriali)(?=\s)/i, () => r.rep = {f:"wd"}) ||
  take(new RegExp("\\s(?:ogni|tutti\\s+i|tutte\\s+le)\\s+"+WD_RE+"(?:\\s*(?:,|e)\\s*"+WD_RE+")*(?=\\s)", "i"), m => {
    const days = [...m[0].matchAll(new RegExp(WD_RE, "gi"))].map(x => wdFrom(x[0])).filter(x => x != null);
    r.rep = {f:"w", n:1, days:[...new Set(days)].sort()}; if (!str.match(/\b(oggi|domani)\b/i)) r.d = r.rep.days.map(i => nextWd(i)).sort()[0];
  }) ||
  take(/\sogni\s+settimana(?=\s)/i, () => r.rep = {f:"w", n:1}) ||
  take(/\s(?:ogni\s+)?(?:fine\s+mese|ultimo\s+giorno\s+del\s+mese)(?=\s)/i, () => { r.rep = {f:"ml"}; r.d = lastDay(today().slice(0,7)); }) ||
  take(/\sogni\s+mese(?=\s)/i, () => r.rep = {f:"m", n:1}) ||
  take(/\sogni\s+anno(?=\s)/i, () => r.rep = {f:"y"});
  // orario
  take(/\s(?:alle|ore|h)\s*(\d{1,2})(?:[:.](\d{2}))?(?=\s)/i, m => { if (+m[1] < 24) r.h = `${pad(+m[1])}:${m[2]||"00"}`; }) ||
  take(/\s(\d{1,2}):(\d{2})(?=\s)/, m => { if (+m[1] < 24) r.h = `${pad(+m[1])}:${m[2]}`; });
  // data
  const y0 = new Date().getFullYear();
  const fixPast = d => (d < today() ? d.replace(/^\d{4}/, String(+d.slice(0,4)+1)) : d);
  take(/\s(?:entro\s+|per\s+)?dopodomani(?=\s)/i, () => r.d = addDays(today(), 2)) ||
  take(/\s(?:entro\s+|per\s+)?domani(?=\s)/i, () => r.d = addDays(today(), 1)) ||
  take(/\s(?:entro\s+)?(oggi|stasera|stamattina)(?=\s)/i, () => r.d = today()) ||
  take(/\s(?:entro\s+la\s+|la\s+)?(prossima\s+settimana|settimana\s+prossima)(?=\s)/i, () => r.d = addDays(monday(today()), 7)) ||
  take(/\s(?:entro\s+|il\s+|per\s+)?(\d{1,2})[\/-](\d{1,2})(?:[\/-](\d{2,4}))?(?=\s)/, m => {
    const yy = m[3] ? (m[3].length === 2 ? 2000 + +m[3] : +m[3]) : y0; const dd = `${yy}-${pad(+m[2])}-${pad(+m[1])}`;
    if (!isNaN(parse(dd))) r.d = m[3] ? dd : fixPast(dd);
  }) ||
  take(new RegExp("\\s(?:entro\\s+|il\\s+|per\\s+)?(\\d{1,2})\\s+"+MESI_RE+"(?:\\s+(\\d{4}))?(?=\\s)", "i"), m => {
    const mi = meseFrom(m[2]); if (mi < 0) return; const dd = `${m[3]||y0}-${pad(mi+1)}-${pad(+m[1])}`; r.d = m[3] ? dd : fixPast(dd);
  }) ||
  (!r.rep && take(new RegExp("\\s(?:entro\\s+|per\\s+|di\\s+)?(?:il\\s+|lo\\s+)?(?:prossimo\\s+)?"+WD_RE+"(?:\\s+prossimo)?(?=\\s)", "i"), m => {
    const i = wdFrom(m[1]); let d = nextWd(i); if (d === today() || /prossimo/i.test(m[0])) d = addDays(d, 7); r.d = d;
  }));
  if (r.rep && !r.d) r.d = today();
  let t = s.replace(/\s+/g, " ").trim();
  if (!t) t = str.trim();
  r.t = t.charAt(0).toUpperCase() + t.slice(1);
  if (!r.area){ // riconosce l'area dal testo: "chiamare CMB" → CMB
    const n = " " + str.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"") + " ";
    const a = allAree().find(a => !a.hidden && [a.nome, a.key].some(w => { const x = w.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""); return x.length > 2 && new RegExp("[^a-z]"+x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"[^a-z]").test(n); }));
    if (a) r.area = a.key;
  }
  return r;
}

/* ---------- salvataggio ---------- */
const newId = () => "t" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const clean = o => { const c = {}; for (const [k,v] of Object.entries(o)) if (v !== undefined && k !== "id") c[k] = v; return c; };
async function save(id, body){ id = id || newId(); await store.save(id, clean(body)); return id; }
const patch = (id, p) => store.patch(id, clean(p));
const del = id => store.del(id);

function addTask(p){
  const body = {k:"task", fat:p.fat||null, t:p.t, d:p.d||null, h:p.h||null, area:p.area||"privato", pr:!!p.pr, rep:p.rep||null, note:p.note||"", sub:p.sub||[], done:false, doneAt:null, doneDates:[], skip:[], cr:new Date().toISOString()};
  return save(null, body);
}
function toggle(t, D){
  ui.pop = `${t.id}|${D||""}`; setTimeout(() => { ui.pop = null; }, 900);
  if (t.rep){
    const dd = new Set(t.doneDates||[]); const was = dd.has(D); was ? dd.delete(D) : dd.add(D);
    patch(t.id, {doneDates:[...dd]});
    if (!was) toast("Fatto ✓", () => { const z = new Set(tasks.get(t.id).doneDates||[]); z.delete(D); patch(t.id, {doneDates:[...z]}); });
  } else {
    const nv = !t.done; patch(t.id, {done:nv, doneAt: nv ? new Date().toISOString() : null});
    if (nv) toast("Fatto ✓", () => patch(t.id, {done:false, doneAt:null}));
  }
}
// sposta una task (per le ricorrenti: solo questa volta)
async function moveTo(t, D, newD){
  if (t.rep){
    patch(t.id, {skip:[...new Set([...(t.skip||[]), D])]});
    if (newD) await save(null, {...clean(t), rep:null, d:newD, skip:[], doneDates:[], done:false, doneAt:null, from:t.id, cr:new Date().toISOString()});
  } else patch(t.id, {d:newD||null});
}

function openModal(html, init){
  const root = $("#modal-root");
  root.innerHTML = `<div class="mback"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const back = root.firstChild, m = back.firstChild;
  const close = () => { root.innerHTML = ""; document.removeEventListener("keydown", onKey); };
  const onKey = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  back.addEventListener("click", e => { if (e.target === back) close(); });
  m.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", close));
  init && init(m, close);
  const f = m.querySelector("input:not([type=radio]):not([type=checkbox]),textarea"); if (f && matchMedia("(min-width:900px)").matches) f.focus();
}

// file .ics con avviso: aprendolo, il telefono la aggiunge al calendario con la notifica
function downloadIcs(v){
  const st = (v.d + "T" + (v.h || "09:00")).replace(/[-:]/g,"") + "00";
  const en = v.h ? (() => { const [H,M] = v.h.split(":").map(Number); const dt = new Date(parse(v.d)); dt.setHours(H, M+30); return iso(dt).replace(/-/g,"") + "T" + pad(dt.getHours()) + pad(dt.getMinutes()) + "00"; })() : null;
  const rr = !v.rep ? "" : v.rep.f === "d" ? "RRULE:FREQ=DAILY\r\n" : v.rep.f === "wd" ? "RRULE:FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR\r\n" : v.rep.f === "w" ? `RRULE:FREQ=WEEKLY;INTERVAL=${v.rep.n||1}${v.rep.days&&v.rep.days.length?";BYDAY="+v.rep.days.map(i=>["MO","TU","WE","TH","FR","SA","SU"][i]).join(","):""}\r\n` : v.rep.f === "m" ? "RRULE:FREQ=MONTHLY\r\n" : v.rep.f === "ml" ? "RRULE:FREQ=MONTHLY;BYMONTHDAY=-1\r\n" : v.rep.f === "y" ? "RRULE:FREQ=YEARLY\r\n" : "";
  const txt = s => String(s||"").replace(/[\\,;]/g, m => "\\"+m).replace(/\n/g,"\\n");
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Agenda Task//IT","BEGIN:VEVENT",`UID:${newId()}@agenda-task`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,"").slice(0,15)}Z`,
    v.h ? `DTSTART:${st}` : `DTSTART;VALUE=DATE:${v.d.replace(/-/g,"")}`, v.h ? `DTEND:${en}` : `DTEND;VALUE=DATE:${addDays(v.d,1).replace(/-/g,"")}`,
    `SUMMARY:${txt(v.t)}`, v.note ? `DESCRIPTION:${txt(v.note)}` : "", rr.trim(), "BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${txt(v.t)}`, v.h ? "TRIGGER:-PT15M" : "TRIGGER:PT9H","END:VALARM","END:VEVENT","END:VCALENDAR"].filter(Boolean).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics], {type:"text/calendar"}));
  a.download = (v.t.slice(0,40).replace(/[^\w\- àèéìòù]/gi,"") || "promemoria") + ".ics";
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast(v.h ? "Promemoria scaricato: aprilo per aggiungerlo al calendario (avviso 15 minuti prima)" : "Promemoria scaricato: aprilo per aggiungerlo al calendario (avviso alle 9)");
}

function applyTheme(k){

function quoteOf(D){ const n = daysBetween("2026-01-01", D); return QUOTES[((n % QUOTES.length) + QUOTES.length) % QUOTES.length]; }
function showSplash(force){
  const t0 = today();
  if (!force){
    if (!showQuote()) return;
    try { if (localStorage.getItem("task-splash") === t0) return; localStorage.setItem("task-splash", t0); } catch(e){}
  }
  const h = new Date().getHours(), nome = settings().nome;
  const sal = (h < 13 ? "Buongiorno" : h < 18 ? "Buon pomeriggio" : "Buonasera") + (nome ? `, ${nome}` : "");
  const q = quoteOf(t0), dl = dayList(t0).filter(i => !i.done), imp = dl.filter(i => i.t.pr).length, late = lateList().length;
  const riep = dl.length ? `Oggi hai ${plural(dl.length,"cosa","cose")} da fare${imp?`, ${imp} ${imp===1?"importante":"importanti"}`:""}${late?` e ${late} in ritardo`:""}.` : late ? `Hai ${plural(late,"task","task")} in ritardo da sistemare.` : "Oggi la lista è libera: goditi la giornata.";
  const el = document.createElement("div"); el.className = "splash"; el.setAttribute("role","dialog"); el.setAttribute("aria-label","Benvenuto");
  el.innerHTML = `<div class="sp-in"><div class="sp-date">${esc(cap(fmtDay(t0)))}</div><div class="sp-hi">${esc(sal)}</div><div class="sp-orn">✦ la frase di oggi ✦</div>
    <blockquote>“${esc(q.t)}”<cite>— ${esc(q.a)}</cite></blockquote>
    <div class="sp-sum">${esc(riep)}</div><button class="sp-go">Inizia la giornata</button></div>`;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add("on"));
  const go = () => { el.classList.remove("on"); setTimeout(() => el.remove(), 350); };
  el.querySelector(".sp-go").addEventListener("click", go);
  el.addEventListener("click", e => { if (e.target === el) go(); });
}
let splashDone = false;
function maybeSplash(){ if (splashDone || mode === "loading") return; splashDone = true; setTimeout(() => showSplash(false), 50); }

/* ---------- toast ---------- */
let toastT;
function toast(msg, undo){
  document.querySelectorAll(".toast").forEach(x => x.remove()); clearTimeout(toastT);
  const d = document.createElement("div"); d.className = "toast"; d.setAttribute("role","status");
  d.innerHTML = `<span>${esc(msg)}</span>${undo?`<button>Annulla</button>`:""}`;
  if (undo) d.querySelector("button").addEventListener("click", () => { undo(); d.remove(); });
  document.body.appendChild(d); toastT = setTimeout(() => d.remove(), undo ? 5000 : 3000);
}

$("#q").addEventListener("input", updatePreview);
$("#scope").addEventListener("click", e => { const b = e.target.closest("[data-s]"); if (!b) return; ui.scope = b.dataset.s; ui.filt = null; try { localStorage.setItem("task-scope", ui.scope); } catch(e){} render(); });

    case "lateall": { const l = lateList(); (async () => { for (const i of l) await moveTo(i.t, i.D, today()); toast(`${plural(l.length,"task portata","task portate")} a oggi`); })(); break; }
    case "chiudi": chiudiGiornata(); break;
    case "pick": pickModal(); break;
    case "addday": taskModal({}, b.dataset.d); break;
    case "tab": ui.tab = b.dataset.tab; history.replaceState(null,"","#"+ui.tab); render(); scrollTo(0,0); break;
    case "wkprev": ui.wk = addDays(ui.wk, -7); render(); break;
    case "wknext": ui.wk = addDays(ui.wk, 7); render(); break;
    case "wktoday": ui.wk = monday(today()); render(); break;

    case "splash": showSplash(true); break;

  }
});

/* ---------- avvio: cloud (Firebase) o anteprima locale ---------- */
function startLocal(){
  mode = "local";
  const KEY = "agenda-task-preview";
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch(e){ return null; } };
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify([...tasks.values()])); } catch(e){} };
  const data = load();
  if (data) data.forEach(x => tasks.set(x.id, x)); else if (window.TASK_DEMO) window.TASK_DEMO(tasks, ext);
  if (window.TASK_DEMO_EXT) window.TASK_DEMO_EXT(ext);
  store = {
    save: async (id, b) => { tasks.set(id, {id, ...b}); persist(); render(); },
    patch: async (id, p) => { const o = tasks.get(id); if (!o) return; tasks.set(id, {...o, ...p}); persist(); render(); },
    del: async id => { tasks.delete(id); persist(); render(); }
  };
  render();
}
async function startCloud(){
  const F = await import("./firebase.js");
  const { firebaseConfig } = await import("./firebase-config.js");
  const app = F.initializeApp(firebaseConfig);
  let auth, fs;
  try { auth = F.initializeAuth(app, {persistence:[F.indexedDBLocalPersistence, F.browserLocalPersistence]}); } catch(e){ auth = F.getAuth(app); }
  try { fs = F.initializeFirestore(app, {localCache: F.persistentLocalCache({tabManager: F.persistentMultipleTabManager()})}); } catch(e){ fs = F.getFirestore(app); }
  window.__signOut = () => F.signOut(auth);
  let col = null, unsubs = [];
  const werr = e => toast(e && e.code === "permission-denied" ? "Salvataggio negato: controlla le regole di Firestore." : "Non sono riuscita a salvare. Riprova.");
  store = {
    save: (id, b) => F.setDoc(F.doc(col, id), b).catch(werr),
    patch: (id, p) => F.setDoc(F.doc(col, id), p, {merge:true}).catch(werr),
    del: id => F.deleteDoc(F.doc(col, id)).catch(werr)
  };
  const errIt = e => ({
    "auth/invalid-credential":"Email o password non corrette.", "auth/wrong-password":"Email o password non corrette.", "auth/user-not-found":"Email o password non corrette.",
    "auth/invalid-email":"Email non valida.", "auth/network-request-failed":"Serve la connessione per il primo accesso. Riprova quando sei online.",
    "auth/too-many-requests":"Troppi tentativi: riprova tra qualche minuto."
  }[e && e.code] || "Qualcosa non ha funzionato. Riprova.");
  const lf = $("#f-login"), err = $("#lg-err");
  lf.addEventListener("submit", e => { e.preventDefault(); err.textContent = ""; F.signInWithEmailAndPassword(auth, lf.elements.email.value.trim(), lf.elements.password.value).catch(x => err.textContent = errIt(x)); });
  $("#lg-reset").addEventListener("click", () => { const em = lf.elements.email.value.trim(); if (!em){ err.textContent = "Scrivi prima la tua email."; return; } F.sendPasswordResetEmail(auth, em).then(() => err.textContent = "Ti ho inviato un'email per reimpostare la password.", x => err.textContent = errIt(x)); });
  F.onAuthStateChanged(auth, u => {
    unsubs.forEach(f => f()); unsubs = [];
    if (!u){ tasks = new Map(); ext = new Map(); col = null; mode = "loading"; render(); $("#login").hidden = false; return; }
    $("#login").hidden = true;
    col = F.collection(fs, "users", u.uid, "tasks");
    unsubs.push(F.onSnapshot(col, {includeMetadataChanges:true}, snap => {
      mode = "cloud"; pendingWrites = snap.metadata.hasPendingWrites;
      const mp = new Map(); snap.docs.forEach(d => mp.set(d.id, {id:d.id, ...d.data()})); tasks = mp; render();
    }, e => toast(e && e.code === "permission-denied" ? "Accesso ai dati negato: controlla le regole di Firestore." : "Non riesco a leggere i dati. Riprova più tardi.")));
    // docenze e fatture dell'Agenda Docenze, in sola lettura
    unsubs.push(F.onSnapshot(F.collection(fs, "users", u.uid, "items"), snap => {
      const mp = new Map(); snap.docs.forEach(d => mp.set(d.id, {id:d.id, ...d.data()})); ext = mp; render();
    }, () => {}));
  });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});
}
try { applyTheme(localStorage.getItem("task-theme") || "cipria"); } catch(e){ applyTheme("cipria"); }

else startCloud().catch(e => { console.error(e); startLocal(); toast("Non riesco a collegarmi al database: uso una copia su questo dispositivo."); });
